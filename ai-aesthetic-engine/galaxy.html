<script id="vs" type="x-shader">#version 300 es
precision highp float;
in float aRad;
in float aArm;
in float aSeed;
uniform float uTime, uRotTime, uRot, uArms, uTwist, uTurb, uSat, uSize, uIncl, uPointScale, uSeed, uExposure, uType;
uniform float uUserRot, uUserIncl, uPanX, uPanY;
uniform vec3 uColA, uColB, uColC;
out vec3 vCol;
out float vAlpha;
const float PI = 3.14159265;
float hash11(float n){ return fract(sin(n*12.9898)*43758.5453); }
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash21(i), b=hash21(i+vec2(1.0,0.0)), c=hash21(i+vec2(0.0,1.0)), d=hash21(i+vec2(1.0,1.0));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
void main(){
  float r = aRad;                 // 0..1 向中心聚集
  float rad = r;                  // 用于上色/点尺寸的径向量
  vec3 pos;
  float spin = uRotTime*uRot + uUserRot;

  if(uType < 0.5){
    // —— 螺旋星系 ——
    float arm = floor(aArm*uArms);
    float armOff = arm*(2.0*PI/uArms) + uSeed*6.2831853;
    float jitter = (hash11(aSeed*3.7)-0.5)*0.40;
    float n = vnoise(vec2(r*3.0, armOff*1.5) + aSeed*13.0 + uTime*0.03 + uSeed*7.0);
    float disp = (n-0.5)*uTurb*0.42*(0.25+r);
    float ang = armOff + jitter + spin + r*uTwist + uSeed*0.7;
    vec2 dir = vec2(cos(ang), sin(ang));
    vec2 pos2 = dir*r + vec2(-dir.y, dir.x)*disp;
    float y = (hash11(aSeed*7.0)-0.5)*0.07*(1.0-r*0.6);
    pos = vec3(pos2.x, y, pos2.y);
  } else if(uType < 1.5){
    // —— 椭圆星系（扁球，无旋臂）——
    float u = aArm*2.0*PI;
    float v = (aSeed-0.5)*PI;
    float rr = pow(r, 0.6);
    pos = vec3(cos(v)*cos(u)*rr, sin(v)*rr*0.55, cos(v)*sin(u)*rr);
    float ca=cos(spin*0.5), sa=sin(spin*0.5);
    pos.xz = mat2(ca,-sa,sa,ca)*pos.xz;
    rad = rr;
  } else if(uType < 2.5){
    // —— 透镜状星系（核球 + 薄盘）——
    if(aSeed < 0.32){
      float u = aArm*2.0*PI; float v=(aSeed*7.0-0.5)*PI*0.5;
      float rr = pow(r,0.5)*0.45;
      pos = vec3(cos(u)*rr, sin(v)*rr*0.6, sin(u)*rr);
    } else {
      float ang = aArm*2.0*PI + r*uTwist*0.4 + spin;
      float rr = 0.12 + r*0.95;
      float disp = (vnoise(vec2(r*4.0, aArm*10.0)+uSeed*5.0)-0.5)*uTurb*0.10;
      pos = vec3(cos(ang)*rr, disp, sin(ang)*rr);
    }
  } else if(uType < 3.5){
    // —— 不规则星系（无对称，团块）——
    float ang = aArm*2.0*PI;
    float rr = pow(r,0.5);
    float n1 = vnoise(vec2(aArm*9.0, aSeed*9.0)+uSeed*3.0);
    float n2 = vnoise(vec2(aSeed*7.0+20.0, aArm*7.0)+uSeed*3.0);
    vec3 c = vec3((n1-0.5)*2.0, (n2-0.5)*1.2, (n1-n2)*1.6);
    pos = vec3(cos(ang)*rr, sin(ang)*rr*0.6, 0.0) + c*rr*0.9*uTurb;
    float ca=cos(spin*0.4), sa=sin(spin*0.4);
    pos.xz = mat2(ca,-sa,sa,ca)*pos.xz;
    rad = rr;
  } else if(uType < 4.5){
    // —— 环星系（核球 + 明亮环）——
    float u = aArm*2.0*PI;
    float ringRad = 0.55 + 0.12*(aSeed-0.5);
    float ringW = 0.08 + 0.06*r;
    float rr = ringRad + (aSeed-0.5)*ringW;
    float y = (hash11(aSeed*7.0)-0.5)*0.06;
    pos = vec3(cos(u)*rr, y, sin(u)*rr);
    // 中央核球（少量粒子）
    if(aSeed < 0.12){
      float rc = pow(r,0.7)*0.18;
      pos = vec3(cos(u)*rc, y*0.5, sin(u)*rc);
    }
    float ca=cos(spin*0.35), sa=sin(spin*0.35);
    pos.xz = mat2(ca,-sa,sa,ca)*pos.xz;
    rad = rr;
  } else if(uType < 5.5){
    // —— 棒旋星系（中央棒 + 旋臂）——
    float arm = floor(aArm*uArms);
    float armOff = arm*(2.0*PI/uArms) + uSeed*6.2831853;
    float barLen = 0.28;
    float barW = 0.07;
    vec3 pbar = vec3(0.0);
    if(r < barLen + hash11(aSeed*2.3)*0.08 && abs(aArm-0.5) < 0.18){
      // 中央棒
      float bx = (aArm-0.5)*barLen*4.0;
      float by = (hash11(aSeed*4.1)-0.5)*barW*(1.0-abs(bx)/barLen);
      pbar = vec3(bx, by*0.3, 0.0);
    }
    float jitter = (hash11(aSeed*3.7)-0.5)*0.35;
    float n = vnoise(vec2(r*3.2, armOff*1.4) + aSeed*13.0 + uTime*0.03 + uSeed*7.0);
    float disp = (n-0.5)*uTurb*0.38*(0.25+r);
    float ang = armOff + jitter + spin + r*uTwist*1.1 + uSeed*0.7;
    // 棒端开始旋臂
    float startR = barLen*0.85;
    float effR = startR + (r-startR)*1.15;
    vec2 dir = vec2(cos(ang), sin(ang));
    vec2 pos2 = dir*effR + vec2(-dir.y, dir.x)*disp;
    float y = (hash11(aSeed*7.0)-0.5)*0.07*(1.0-r*0.5);
    pos = vec3(pos2.x, y, pos2.y);
    if(length(pbar)>0.001) pos = pbar;
    float ca=cos(spin*0.3), sa=sin(spin*0.3);
    pos.xz = mat2(ca,-sa,sa,ca)*pos.xz;
  } else {
    // —— 并合星系（双核 + 潮汐尾）——
    float u = aArm*2.0*PI;
    float which = (aSeed < 0.5) ? 0.0 : 1.0;
    float offX = (which-0.5)*0.55;
    float offY = (which-0.5)*0.12;
    float rr = pow(r,0.65)*0.55;
    float n1 = vnoise(vec2(aArm*6.0, aSeed*6.0)+uSeed*3.0+uTime*0.02);
    float n2 = vnoise(vec2(aSeed*5.0+20.0, aArm*5.0)+uSeed*3.0);
    // 潮汐尾：从每个核延伸出的弧形尾
    float tailAng = u + which*3.14159265 + spin*0.5 + r*2.5;
    float tailR = 0.55 + r*0.9;
    vec3 tail = vec3(cos(tailAng)*tailR, sin(tailAng)*0.15, sin(tailAng)*tailR);
    tail += vec3((n1-0.5)*0.4, (n2-0.5)*0.25, (n1-n2)*0.35)*uTurb;
    // 核球
    vec3 core = vec3(cos(u)*rr + offX, sin(u)*rr*0.35 + offY, sin(u)*rr);
    pos = mix(core, tail, smoothstep(0.35,0.85,r));
    float ca=cos(spin*0.25), sa=sin(spin*0.25);
    pos.xz = mat2(ca,-sa,sa,ca)*pos.xz;
    rad = rr + 0.15;
  }

  float incl = uIncl + uUserIncl;
  float ci=cos(incl), si=sin(incl);
  pos.yz = mat2(ci,-si,si,ci)*pos.yz;
  pos.xy += vec2(uPanX, uPanY);
  float w = pos.z + 2.6;
  gl_Position = vec4(pos.xy*1.5, 0.0, w);

  // 三段颜色渐变：核心 uColA → 中段 uColB → 外缘 uColC
  vec3 grad = (rad<0.5) ? mix(uColA, uColB, rad*2.0) : mix(uColB, uColC, (rad-0.5)*2.0);
  float core = smoothstep(0.34, 0.0, rad);
  vCol = grad + uColA*core*0.45;
  float tw = 0.6 + 0.4*sin(uTime*1.5 + aSeed*40.0);
  vAlpha = (0.30+0.45*aSeed)*(1.0-rad*0.45)*tw;
  float sz = uSize*uPointScale*(0.6+0.8*aSeed)*(0.7+0.5*(1.0-rad))*6.0/w;
  gl_PointSize = clamp(sz, 1.0, 24.0);
}
</script>

<script id="fs" type="x-shader">#version 300 es
precision highp float;
in vec3 vCol;
in float vAlpha;
uniform float uExposure;
out vec4 fragColor;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  float r2 = dot(d,d);
  if(r2 > 0.25) discard;
  float glow = smoothstep(0.25, 0.0, r2);
  fragColor = vec4(vCol*glow*vAlpha*uExposure, 1.0);
}
</script>

<script>
(function(){
  "use strict";
  let energySave = true;
  let rotPaused = false, pauseT = 0;
  // 鼠标拖拽旋转/倾斜（暂停旋转后仍可拖动）
  let userRot = 0, userIncl = 0, panX = 0, panY = 0;
  // ---------- 主题 ----------
  function themeInit(){
    const saved=localStorage.getItem('aae-theme');
    if(saved) document.documentElement.setAttribute('data-theme', saved);
    refreshThemeBtn();
  }
  function refreshThemeBtn(){
    const t=document.documentElement.getAttribute('data-theme');
    document.getElementById('themeToggle').textContent=(t==='dark'?'🌙 切暗色':'☀️ 切亮色');
  }
  document.getElementById('themeToggle').addEventListener('click', ()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next=(cur==='dark')?'light':'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('aae-theme', next); }catch(e){}
    refreshThemeBtn();
  });
  themeInit();

  // ---------- 节能/暂停 ----------
  const ecoBtn=document.getElementById('ecoToggle');
  const pauseBtn=document.getElementById('pauseBtn');

  // ---------- 工具 ----------
  function clamp(x,a,b){return Math.max(a,Math.min(b,x));}

  function rgb2hsv(r,g,b){
    let max=Math.max(r,g,b), min=Math.min(r,g,b), h=0,s=0,v=max;
    const d=max-min; s=max===0?0:d/max;
    if(d!==0){
      if(max===r) h=((g-b)/d+(g<b?6:0))/6;
      else if(max===g) h=((b-r)/d+2)/6;
      else h=((r-g)/d+4)/6;
    }
    return [h,s,v];
  }

  const canvas=document.getElementById('bg');

  function compile(type, src){

  function drawStars(hue){

    starCanvas.width=Math.floor(w*dpr); starCanvas.height=Math.floor(hgt*dpr);

    const cx=w*0.5, cy=hgt*0.5, rad=Math.max(w,hgt)*0.42;
    const g0=sctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    g0.addColorStop(0,`hsla(${Math.round(curHue*360)},70%,60%,0.10)`);
    g0.addColorStop(0.5,`hsla(${Math.round(curHue*360)},70%,55%,0.04)`);
    g0.addColorStop(1,'hsla(0,0%,0%,0)');
    sctx.fillStyle=g0; sctx.fillRect(0,0,w,hgt);
    const neb=[[0.18,0.25,210,150],[0.82,0.7,300,120],[0.5,0.88,180,210]];

      const cxp=nx*w, cyp=ny*hgt, radn=Math.max(w,hgt)*0.35;
      const g=sctx.createRadialGradient(cxp,cyp,0,cxp,cyp,radn);
      g.addColorStop(0,`hsla(${hueN},60%,60%,${bright/1000})`);
      g.addColorStop(1,'hsla(0,0%,0%,0)');
      sctx.fillStyle=g; sctx.fillRect(0,0,w,hgt);
    });
    const n=Math.floor((w*hgt)/2200);
    for(let i=0;i<n;i++){

  function buildFromVector(vec){
    const has=(vec&&vec.length>=8);
    const v=has?vec:[0,0,0,0,0,0,0,0];
    const f=x=>clamp01((clamp(x,-1,1)*0.5)+0.5);
    const F = { o:f(v[0]), s:f(v[1]), w:f(v[2]), e:f(v[3]), n:f(v[4]), t:f(v[5]), l:f(v[6]), c:f(v[7]) };
    let hue = 0.583 - 0.505*F.w;
    const kc = clamp01((F.c-0.5)*1.2);  hue = hue*(1-kc) + 0.125*kc;          // 神圣→金
    if(F.n<0.4){ const kn=(0.4-F.n); hue = hue*(1-kn*0.7) + 0.78*(kn*0.7); }   // 人工→霓虹紫
    hue = ((hue%1)+1)%1;
    let sat = clamp01(0.30 + 0.5*F.e + 0.15*(1-F.s));
    params.uColA=hsv2rgbArr(hue, sat, 0.95);
    params.uColB=hsv2rgbArr((hue+0.10)%1, sat*0.9, 0.85);
    params.uColC=hsv2rgbArr((hue+0.55)%1, 0.65, 1.0);
    // 结构形态：秩序→螺旋；混沌→不规则；中性→透镜（仅有向量且用户未手动选类型时）
    if(has && !manualType){
      if(v[0] > 0.30) setType('spiral');
      else if(v[0] < -0.30) setType('irregular');
      else setType('lenticular');
    }
    params.uArms  = 2 + Math.round(4*F.w);                  // 暖→多旋臂
    params.uTwist = 2 + 9*F.t;                              // 未来→紧致
    params.uRot   = 0.04 + 0.24*F.l;                        // 轻盈→快
    params.uTurb  = 0.2 + 1.3*F.t;
    params.uSat   = 0.45 + 0.4*F.e;
    params.uSize  = 0.8 + 1.6*F.l;                          // 轻盈→展开
    params.uIncl  = 0.4 + 1.0*F.c;                          // 神圣→正面仰角
    params.uExposure = 0.7;
    clampParams(); syncSlidersFromParams(); renderPalette();
  }
  function hsv2rgbArr(h,s,v){
    h=((h%1)+1)%1; let i=Math.floor(h*6), f=h*6-i;
    let p=v*(1-s), q=v*(1-s*f), t=v*(1-s*(1-f)), r,g,b;
    switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;
      case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;default:r=v;g=p;b=q;break;}
    return [r,g,b];
  }
  function applyStyle(text){
    text=(text||'').toLowerCase();
    for(const name in STYLE_PAL){
      if(text.indexOf(name.replace(/星系/,'').toLowerCase())>=0 || text===name.toLowerCase()){
        setPalette(STYLE_PAL[name]); return;
      }
    }
    applyDescription(text);
  }
  function applyDescription(text){
    text=(text||'').toLowerCase(); if(!text) return;
    const hueMap={紫:270,purple:270,紫罗兰:270,violet:270,lavender:270,
      金:45,gold:45,琥珀:40,橙:28,orange:28,蓝:210,blue:210,青:185,cyan:185,翠:150,绿:135,green:135,
      粉:330,pink:330,红:0,red:0,玫:340};
    let fh=null;
    for(const k in hueMap){ if(text.indexOf(k)>=0){ fh=hueMap[k]/360; break; } }
    if(fh!==null){
      const sat=text.indexOf('赛博')>=0||text.indexOf('cyber')>=0?0.95:0.75;
      setPalette([hsv2rgbArr(fh,sat,0.95), hsv2rgbArr((fh+0.12)%1,sat*0.85,0.85), hsv2rgbArr((fh+0.55)%1,0.65,1.0)]);
    }
    if(text.indexOf('神圣')>=0||text.indexOf('divine')>=0) setPalette(STYLE_PAL['神圣金色星系']);
    if(text.indexOf('蓝紫')>=0) setPalette(STYLE_PAL['蓝紫金色星系']);
    if(text.indexOf('螺旋')>=0){ params.uTwist*=1.3; setType('spiral'); }
    if(text.indexOf('椭圆')>=0||text.indexOf('elliptical')>=0){ setType('elliptical'); }
    if(text.indexOf('透镜')>=0||text.indexOf('lenticular')>=0){ setType('lenticular'); }
    if(text.indexOf('不规则')>=0||text.indexOf('irregular')>=0){ setType('irregular'); }
    if(text.indexOf('深邃')>=0||text.indexOf('深')>=0){ params.uTurb*=0.7; params.uSize*=0.85; }
    if(text.indexOf('快')>=0||text.indexOf('fast')>=0){ params.uRot*=1.8; }
    if(text.indexOf('慢')>=0||text.indexOf('slow')>=0){ params.uRot*=0.5; }

  // ---------- 渲染循环 ----------
  let running=false, rafId=null, lastTs=null;

  function frame(now){
    if(energySave && document.hidden){ running=false; return; }
    if(lastTs===null) lastTs=now;
    const t=(now-t0)/1000;
    const rotT = rotPaused ? pauseT : t;
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uRotTime, rotT);
    gl.uniform1f(U.uRot, params.uRot);
    gl.uniform1f(U.uArms, params.uArms);
    gl.uniform1f(U.uTwist, params.uTwist);
    gl.uniform1f(U.uTurb, params.uTurb);
    gl.uniform1f(U.uSat, params.uSat);
    gl.uniform1f(U.uSize, params.uSize);
    gl.uniform1f(U.uIncl, params.uIncl);
    gl.uniform1f(U.uSeed, params.uSeed);
    gl.uniform1f(U.uExposure, params.uExposure);
    gl.uniform1f(U.uType, params.uType);
    gl.uniform1f(U.uUserRot, userRot);
    gl.uniform1f(U.uUserIncl, userIncl);
    gl.uniform1f(U.uPanX, panX);
    gl.uniform1f(U.uPanY, panY);
    gl.uniform3fv(U.uColA, params.uColA);
    gl.uniform3fv(U.uColB, params.uColB);
    gl.uniform3fv(U.uColC, params.uColC);
    gl.clearColor(0.0,0.0,0.0,0.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.POINTS, 0, COUNT);
    rafId=requestAnimationFrame(frame);

  // ---------- 鼠标拖拽：旋转 / 倾斜（暂停旋转后仍可拖动） ----------
  (function attachDrag(){
    let dragging=false, lx=0, ly=0;
    canvas.style.cursor='grab';
    canvas.addEventListener('pointerdown', e=>{
      dragging=true; lx=e.clientX; ly=e.clientY;
      try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
      canvas.style.cursor='grabbing';
    });
    canvas.addEventListener('pointermove', e=>{
      if(!dragging) return;
      const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
      userRot += dx*0.006;                       // 横向拖拽 → 旋转
      userIncl = clamp(userIncl + dy*0.006, -1.2, 1.2); // 纵向拖拽 → 倾斜视角
    });
    const end=()=>{ dragging=false; canvas.style.cursor='grab'; };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
  })();

  let activeType='spiral';

      el.classList.toggle('active', el.getAttribute('data-t')===name);
    });
    const isSpiral = name==='spiral';
    ['pArms','pTwist'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.disabled = !isSpiral;
      const row = el ? el.closest('.row') : null;
      if(row) row.style.opacity = isSpiral ? 1 : 0.4;
    });
  }
  document.querySelectorAll('#types .type').forEach(el=>{
    el.addEventListener('click', ()=>{ manualType=true; setType(el.getAttribute('data-t')); });  // 手动锁定类型
  });

  // ---------- UI ----------
  const sliderMap={
    pArms:['uArms',2,6,'vArms',v=>v.toFixed(0)],

    pRot:['uRot',0.01,0.35,'vRot',v=>v.toFixed(3)],
    pTurb:['uTurb',0.1,1.6,'vTurb',v=>v.toFixed(2)],
    pGlow:['uSize',0.4,2.0,'vGlow',v=>v.toFixed(2)],

  function syncSlidersFromParams(){
    setSl('pArms', params.uArms, 2,6, true);
    setSl('pTwist', params.uTwist, 2,12);
    setSl('pRot', params.uRot, 0.01,0.35);
    setSl('pTurb', params.uTurb, 0.1,1.6);

  function setSl(id,val,min,max,isInt){
    const el=document.getElementById(id); if(!el)return;
    el.value=Math.round((val-min)/(max-min)*100);
    const lab=document.getElementById(sliderMap[id][3]);
    if(lab) lab.textContent = isInt? Math.round(val).toString() : sliderMap[id][4](val);
  }
  Object.keys(sliderMap).forEach(id=>{
    const [key,min,max,labId,fmt]=sliderMap[id];
    const el=document.getElementById(id);
    el.addEventListener('input', ()=>{
      let val=Number(el.value)/100*(max-min)+min;
      if(id==='pArms') val=Math.round(val);
      params[key]=val;
      document.getElementById(labId).textContent=fmt(val);
    });
  });

  document.getElementById('panelToggle').addEventListener('click', ()=>{
    const p=document.getElementById('panel'), b=document.getElementById('panelBody');
    const c=p.classList.toggle('collapsed');
    b.classList.toggle('hidden', c);
    document.getElementById('panelToggle').textContent=c?'展开':'收起';
  });

  function loadVec(){
    try{ const raw=localStorage.getItem('aae-aesthetic-vector');
      if(raw){ const a=JSON.parse(raw); if(Array.isArray(a)&&a.length>=8) return a; } }catch(e){}
    return null;
  }
  let activeZodiac=null;       // 星座 → 形态/形状
  let activePresetName=null;   // 风格预设 → 颜色
  let manualType=false;        // 用户手动选过类型后，向量不再覆盖类型
  let suppressZodiacPalette=false; // 用户手动选预设时，本次允许覆盖星座配色
  function doGenerate(){
    const txt=document.getElementById('descInput').value.trim();
    params.uSeed = Math.random()*1000.0;
    buildFromVector(loadVec());
    if(txt) applyStyle(txt);                          // 风格预设关键词 / 自由描述 → 仅改色
    else if(activePresetName) setPalette(STYLE_PAL[activePresetName]);
    if(activeZodiac) applyZodiacMorph(activeZodiac, suppressZodiacPalette);  // 星座 → 形态 + 风格预设
    suppressZodiacPalette=false;
    clampParams(); syncSlidersFromParams(); renderPalette();
    setBadge(txt);
  }
  document.getElementById('genBtn').addEventListener('click', doGenerate);
  document.getElementById('regenBtn').addEventListener('click', doGenerate);
  document.querySelectorAll('.preset').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.hasAttribute('data-default')){ resetDefault(); return; }
      activePresetName = el.getAttribute('data-d');
      document.getElementById('descInput').value = activePresetName;
      document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
      el.classList.add('active');
      suppressZodiacPalette = true;   // 用户手动选择预设 → 优先于星座配色
      doGenerate();
    });
  });
  document.querySelectorAll('.zodiac').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeZodiac=el.getAttribute('data-z');
      document.querySelectorAll('.zodiac').forEach(z=>z.classList.remove('active'));
      el.classList.add('active');
      doGenerate();
    });
  });
  function setBadge(txt){
    const b=document.getElementById('badge');
    const fromVec=loadVec()?'基于你的 8 维审美向量':'随机向量（未完成测评）';
    let mode='';
    if(activeZodiac) mode=' · 星座形态：'+activeZodiac;
    if(activePresetName && !txt) mode+=' · 风格：'+activePresetName.replace(/星系/,'');
    else if(txt) mode+=' · 描述：'+txt;
    b.innerHTML='🌠 <b>'+fromVec+'</b>'+mode+'<br>'+COUNT.toLocaleString()+' 粒子 · 类型 '+TYPE_CN[activeType]+
      ' · 旋臂 '+params.uArms+' · 拖拽画面可旋转/倾斜视角（暂停旋转后仍可拖动）。';
  }

  // 恢复到首次打开该页面时的初始外观
  function resetDefault(){
    params.uSeed = Math.random()*1000.0;
    manualType=false;
    const vv = loadVec();
    buildFromVector(vv);
    activeZodiac = null;
    document.querySelectorAll('.zodiac').forEach(z=>z.classList.remove('active'));
    if(vv){
      activePresetName = null;
      document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
    } else {
      activePresetName = '蓝紫金色星系';
      setPalette(STYLE_PAL[activePresetName]);
      document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
    }
    const defChip = document.querySelector('#presets .preset[data-default]');
    if(defChip) defChip.classList.add('active');
    clampParams(); syncSlidersFromParams(); renderPalette();
    setBadge('');
  }

  // 初始化
  const v=loadVec();
  params.uSeed = Math.random()*1000.0;
  if(v) buildFromVector(v);
  else { buildFromVector(null); activePresetName='蓝紫金色星系'; setPalette(STYLE_PAL[activePresetName]);
         const def=document.querySelector('.preset[data-d="'+activePresetName+'"]'); if(def) def.classList.add('active'); }
  syncSlidersFromParams(); renderPalette();
  startLoop();
  setBadge('');

  const quizBanner=document.getElementById('quizBanner');
  document.getElementById('quizClose').addEventListener('click', ()=>quizBanner.classList.add('hidden'));
  if(!v) quizBanner.classList.remove('hidden');
})();
</script>
</body>
</html>
