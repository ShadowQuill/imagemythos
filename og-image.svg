<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="78%" cy="-12%" r="80%">
      <stop offset="0%" stop-color="#1c2552"/>
      <stop offset="58%" stop-color="#0b0e1a"/>
    </radialGradient>
    <radialGradient id="neb" cx="80%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#7c8cff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#46d6c0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0b0e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
