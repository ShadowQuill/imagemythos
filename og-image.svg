      <stop offset="100%" stop-color="#46d6c0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#aeb8da"/>
      <stop offset="100%" stop-color="#46d6c0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="300" r="300" fill="url(#neb)"/>
  <!-- 星系核 -->
  <circle cx="950" cy="300" r="60" fill="url(#core)"/>
  <circle cx="950" cy="300" r="14" fill="#ffffff" opacity="0.95"/>
  <!-- 螺旋臂 -->
  <g stroke="url(#accent)" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M950 300 C 1000 270, 1080 300, 1080 360 C 1080 430, 980 470, 900 440 C 820 410, 820 320, 900 280"/>
    <path d="M950 300 C 900 330, 820 300, 820 240 C 820 170, 920 130, 1000 160 C 1080 190, 1080 280, 1000 320"/>
  </g>
  <!-- 星点 -->
  <g fill="#ffffff">
    <circle cx="180" cy="120" r="1.4" opacity="0.8"/>
    <circle cx="300" cy="520" r="1.1" opacity="0.6"/>
    <circle cx="520" cy="90" r="1.3" opacity="0.7"/>
    <circle cx="700" cy="560" r="1.0" opacity="0.5"/>
    <circle cx="1120" cy="120" r="1.5" opacity="0.8"/>
    <circle cx="1050" cy="500" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="430" r="1.0" opacity="0.5"/>
    <circle cx="430" cy="300" r="1.1" opacity="0.6"/>
  </g>
  <!-- 左侧暗化蒙版 -->
  <rect x="0" y="0" width="660" height="630" fill="#03040a" opacity="0.55"/>

  <!-- 文案 -->
  <text x="92" y="118" font-family="Helvetica, Arial, sans-serif" font-size="24" letter-spacing="6" fill="url(#accent)">I M A G E   M Y T H O S</text>
  <circle cx="74" cy="111" r="8" fill="url(#accent)"/>
  <text x="86" y="238" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="url(#title)">ImageMythos</text>
  <text x="92" y="320" font-family="'Hiragino Sans GB','PingFang SC',sans-serif" font-size="36" fill="#e8ecfb">把你的审美画像变成神性视觉</text>
  <text x="92" y="384" font-family="'Hiragino Sans GB','PingFang SC',sans-serif" font-size="24" fill="#aeb8da">8 维审美向量 → 星云 · 流场 · 星系</text>
  <text x="92" y="420" font-family="'Hiragino Sans GB','PingFang SC',sans-serif" font-size="24" fill="#aeb8da">出图 · 视频 · 3D · 一键分享卡</text>
  <rect x="92" y="452" width="70" height="4" rx="2" fill="url(#accent)"/>
  <text x="92" y="492" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#9fe7d8">imagemythos.fun</text>
</svg>
